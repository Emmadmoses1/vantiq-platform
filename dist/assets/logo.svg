<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="110" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  <!-- V letter -->
  <path d="M130 150 L256 370 L382 150" fill="none" stroke="url(#icon)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chart line accent below V -->
  <path d="M100 410 L170 360 L240 385 L310 330 L380 345 L420 310" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

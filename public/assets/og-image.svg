<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05080f"/>
      <stop offset="100%" style="stop-color:#0f1520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="rgba(59,130,246,0.08)" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(59,130,246,0.08)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="rgba(59,130,246,0.08)" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="rgba(59,130,246,0.08)" stroke-width="1"/>
  <!-- Glow orb -->
  <circle cx="600" cy="315" r="300" fill="rgba(59,130,246,0.04)"/>
  <!-- Logo box -->
  <rect x="520" y="180" width="160" height="160" rx="36" fill="url(#accent)"/>
  <path d="M554 220 L600 300 L646 220" fill="none" stroke="white" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Brand name -->
  <text x="600" y="400" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle" letter-spacing="12">VANTIQ</text>
  <!-- Tagline -->
  <text x="600" y="445" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="6">PRECISION · INTELLIGENCE · MARKET EDGE</text>
  <!-- Bottom accent line -->
  <rect x="480" y="480" width="240" height="3" rx="2" fill="url(#accent)"/>
</svg>
